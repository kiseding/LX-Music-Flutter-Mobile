name: live_activities
description: iOS Live Activities / Dynamic Island support (vendored & patched for LX2IOS).
version: 2.5.1
homepage: https://dimitridessus.fr/
repository: https://github.com/istornz/live_activities

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_app_group_directory: ^1.1.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiveActivitiesPlugin
